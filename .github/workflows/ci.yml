name: Verify DebugRoom
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: debugroom
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: debugroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debugroom -d debugroom"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://debugroom:test-only-password@127.0.0.1:5432/debugroom
      TEST_DATABASE_URL: postgresql://debugroom:test-only-password@127.0.0.1:5432/debugroom
      PYTHON_CONTAINER_RUNTIME: runsc
      CPP_CONTAINER_RUNTIME: runc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: bash infra/install-gvisor.sh
      - run: docker build -f runner/python/Dockerfile -t debugroom-python:local .
      - run: docker build -f runner/cpp/Dockerfile -t debugroom-cpp:local .
      - run: npm run test:sandbox
      - run: npm run test:cpp
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7
